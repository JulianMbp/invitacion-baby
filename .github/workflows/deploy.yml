name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue con Docker..."
            
            # Cambiar al directorio del proyecto
            cd ${{ secrets.SERVER_PATH || '/home/julian/invitacion-baby' }}
            echo "📁 Directorio actual: $(pwd)"
            
            # Actualizar código desde Git
            echo "📥 Haciendo pull desde main..."
            git pull origin main
            
            # Construir y reiniciar contenedor Docker
            echo "🐳 Construyendo y reiniciando contenedor Docker..."
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            # Limpiar imágenes antiguas (opcional)
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f
            
            echo "🎉 Despliegue completado!"

