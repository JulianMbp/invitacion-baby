version: '3.8'

services:
  invitation-baby:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invitation-baby
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
    networks:
      - nginx-proxy-manager_default
    volumes:
      # Opcional: si necesitas montar algún volumen
      # - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro

networks:
  nginx-proxy-manager_default:
    external: true

